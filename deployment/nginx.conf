# ============================================================
# Nginx 配置 - MCP × Multimodal RAG 前端 (Cycle 50 G50-04)
# ============================================================
# 核心作用：托管 Vite 构建产物，配置 SPA 路由 + 安全头 + 缓存
# 运行流程：
#   1. SPA 路由 fallback (所有未匹配路径重定向到 index.html)
#   2. Gzip 压缩 (text/css/js/svg)
#   3. 静态资源长期缓存 (1y)
#   4. 安全头: CSP / HSTS / X-Frame-Options
#   5. 健康检查端点 /healthz
#   6. /metrics 暴露 Prometheus 指标
# 输入参数：通过环境变量注入 API 地址
# 输出结果：监听 8080 端口的 SPA
# 修改记录：
#   - 2026-08-01 | v1.0.0 | Cycle 50 G50-04 初次创建
# ============================================================

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # ============================================================
    # 根目录
    # ============================================================
    root /usr/share/nginx/html;
    index index.html;

    # ============================================================
    # 日志
    # ============================================================
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # ============================================================
    # 安全头 (Content Security Policy / HSTS / X-Frame)
    # ============================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CSP - 允许内联 (Vite 注入) + Volcengine API
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://ark.cn-beijing.volces.com https://*.volces.com http://localhost:8000 ws: wss:; frame-ancestors 'self'; form-action 'self'; base-uri 'self';" always;

    # ============================================================
    # Gzip 压缩
    # ============================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # ============================================================
    # 静态资源缓存 (1 年, 带 hash 的 Vite assets)
    # ============================================================
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 字体缓存
    location ~* \.(woff|woff2|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 图片缓存
    location ~* \.(png|jpg|jpeg|gif|ico|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ============================================================
    # 健康检查
    # ============================================================
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Prometheus metrics 暴露点
    location = /metrics {
        access_log off;
        default_type text/plain;
        # 前端 SPA 不直接暴露 Prometheus, 此端点用于健康探针
        return 200 "# MCP frontend metrics endpoint - see backend /metrics\n";
    }

    # ============================================================
    # 后端 API 反向代理 (通过环境变量注入)
    # ============================================================
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
    }

    # ============================================================
    # SPA 路由 fallback
    # ============================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ============================================================
    # 隐藏敏感文件
    # ============================================================
    location ~ /\.(env|git|svn|docker) {
        deny all;
        return 404;
    }

    location ~ \.(md|yml|yaml|json|lock)$ {
        # 拒绝访问配置文件
        if ($uri ~* "(\.md|\.yml|\.yaml|\.json|\.lock)$") {
            # 允许 vite manifest
            set $is_manifest 0;
            if ($uri ~* "manifest") { set $is_manifest 1; }
            if ($is_manifest = 0) { return 404; }
        }
    }

    # ============================================================
    # 错误页
    # ============================================================
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}
