# ============================================================
# Nginx 反向代理配置 - Claude Code 调度平台
# ============================================================
# 核心作用：将外部 80 端口请求反向代理到 backend:8000，
#          并对外提供前端 dist 静态文件服务
# 运行流程：
#   1. 监听 80 端口
#   2. /api/* 与 /ws/* 反向代理到 backend 容器
#   3. 启用 gzip 压缩提升传输效率
#   4. 根路径 / 提供前端构建产物（frontend/dist）
#   5. 隐藏 nginx 版本号等敏感信息
# 输入参数：通过环境变量或 docker-compose 注入
# 输出结果：对外可访问的统一入口
# 修改记录：
#   - 2026-07-24 | v1.0.0 | Module F2 - 基础设施升级：nginx 反向代理
# ============================================================

# ============================================================
# 后端 upstream
# ============================================================
upstream claude_code_backend {
    # 通过 docker-compose service 名解析
    server backend:8000;
    keepalive 32;
}

# ============================================================
# 主 server 块
# ============================================================
server {
    listen 80;
    server_name _;

    # 隐藏 nginx 版本号
    server_tokens off;

    # 上传体积（仓库/会话/文件较大）
    client_max_body_size 50m;

    # ============================================================
    # gzip 压缩
    # ============================================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # ============================================================
    # 后端 API 路由：/api/* → backend:8000
    # ============================================================
    location /api/ {
        proxy_pass http://claude_code_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ============================================================
    # WebSocket 路由：/ws/* → backend:8000
    # ============================================================
    location /ws/ {
        proxy_pass http://claude_code_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ============================================================
    # 健康检查透传
    # ============================================================
    location = /health {
        proxy_pass http://claude_code_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ============================================================
    # 前端静态文件：/ → frontend/dist
    # ============================================================
    root /app/frontend/dist;
    index index.html;

    # 静态资源走 nginx 直接服务（Vue/Vite 产物）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 根路径与 SPA 路由：history mode fallback 到 index.html
    location / {
        try_files $uri $uri/ /index.html;
        # 防止浏览器继续使用旧 bundle（与后端 no_store_frontend_static_cache 一致）
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
